# Lush Foliage - recomp features this mod turns on (runtime/mods.h: mod.ini)
# Grass, flowers and small plants: each one drawn this many times (1 = the game's, up to 4)
plant_density = 3
# How far (metres) the extra plants stand from the one they copy - small keeps them off paths
plant_spread = 0.6
# More trees: built from your own game files the first time the game starts with this mod on (about a second)
tree_patch = trees.lft
